<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        .container {
            border: 2px solid black;
            width: 240px;
            border-radius: 100%;
            height: 240px;
            text-align: center;
            margin: auto;
            margin-top: 50px;
            background-color: rgba(235, 235, 235, 0.637);
            box-shadow: 3px 3px 8px rgb(0, 0, 0);
        }

        .banner {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
        }

        .clock {
            border: 2px solid rgb(0, 0, 0);
            width: 150px;
            height: 28px;
            border-radius: 10px;
            padding: 5px;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.841);
            margin-top: 70px;
            color: white;
            font-weight: bold;
        }

        .sp button {
            margin: 2px;
            margin-top: 15px;
            padding: 8px;
            border-radius: 5px;
            border: 2px solid rgb(205, 203, 203);
            background-color: rgb(205, 203, 203);
            cursor: pointer;
            box-shadow: 2px 2px;
            /* transition: all 0.1s ease-in; */
        }
        
        .sp button:active {
            translate: 1px 2px;
            box-shadow: 0px 0px;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>Your Local Time</h2>
    <div class="container">
        <div class="clock">00:00:00</div>
        <span class="sp"><button id="Start">Start</button></span>
        <span class="sp"><button id="Stop">Stop</button></span>
        <span class="sp"><button id="Reset">Reset</button></span>
    </div>

    <script>
        const clock = document.querySelector('.clock');
        const startBtn = document.querySelector('#Start');
        const stopBtn = document.querySelector('#Stop');
        const resetBtn = document.querySelector('#Reset');
        let timer = null;

        // Function to update clock
        function updateClock() {
            const date = new Date();
            clock.innerHTML = date.toLocaleTimeString();
        }

        // Start clock
        startBtn.addEventListener('click', () => {
            if (timer === null) { // prevent multiple intervals
                updateClock(); // update immediately
                timer = setInterval(updateClock, 1000);
            }
        });

        // Stop clock
        stopBtn.addEventListener('click', () => {
            clearInterval(timer);
            timer = null;
        });

        // Reset clock to 00:00:00
        resetBtn.addEventListener('click', () => {
            clearInterval(timer);
            timer = null;
            clock.innerHTML = "00:00:00";
        });
    </script>
</body>
</html>
