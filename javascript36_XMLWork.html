<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile</title>
</head>
<body style="background-color: #212121;">

<script>
    const div = document.createElement('div')
    div.setAttribute('id','divId')
    div.setAttribute('class','div')
    div.style.backgroundColor = "white"
    div.style.width = "312px"
    div.style.height = "212px"
    div.style.borderRadius = "12px"
    div.style.border = "black"
    // console.log(div)

    const requestUrl = "https://api.github.com/users/codeurge123";
    // console.log(requestUrl)
    const xhr = new XMLHttpRequest()
    xhr.open('GET',requestUrl)

    // Tracking request continously 
    xhr.onreadystatechange = function() {
        // console.log(xhr.readyState)
        
        if(xhr.readyState === 4) {
            const data = JSON.parse(this.responseText) // b/c es request se humko return mein mila ga 'responseText'
            // conso`le.log(typeof data)
            console.log(data.name)
            console.log(data.id)
            // document.querySelector('div').innerText = data.name 
        }
    }

    xhr.send()

    // Contiune this later api limit exceed.


    


    document.querySelector('body').appendChild(div)

</script>
</html>
